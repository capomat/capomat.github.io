<style>
:root{
  --red:#EF452E; --cap:#2f6bff; --green:#34B244;  /* красный и зелёный чуть теплее — под винтажную палитру */
  --accent:#F0BB2F; --ink:#100C02; --nav:#0B0A07; --room-black:#211F19; --ivory:#F2E9D4; --room-white:#F6EFE0;  /* палитра: акцент, «чёрный», фон страницы, чёрная секция, слоновая кость, белая секция */
  /* роли: окна лежат на цвете чёрной секции, текст и контуры — слоновая кость. Сайт тёмный при любой теме системы */
  --bg:var(--room-black); --fg:var(--ivory); --btn:var(--ivory); --btnfg:var(--ink);
  color-scheme:dark;  /* системные элементы (поле ввода, прокрутка) — тёмные */
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--nav);color:var(--fg);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;flex-direction:column;gap:10px;padding:12px 16px 10px;flex:none;color:var(--fg)}
h1{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:22px;line-height:28px;height:28px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent}
.home:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.home .logo{display:block;width:37px;height:28px;flex:none}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;height:48px}
.stats{display:flex;gap:28px}
.stat{display:flex;flex-direction:column;line-height:1}
.stat span{font-size:12px;opacity:.6;margin-bottom:5px}
.stat b{font-family:'Saira Condensed',Unbounded,system-ui,sans-serif;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;min-width:5ch}
@media (max-width:899px){.stats{gap:16px}.stat b{min-width:0}.stat #score{min-width:2.4em}}  /* телефон и планшет — одинаково, без скачков при смене ширины */
/* Телефон и планшет: 1-я строка — заголовок | звук, 2-я — счёт | Ловцы, База */
@media (max-width:899px){
  header{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:8px;row-gap:10px;align-items:center}
  header .bar-row,header .hdr-actions{display:contents}
  header h1{grid-column:1/-1;grid-row:1;padding-right:104px}  /* на всю ширину, справа место под кнопки Telegram и звука */
  header .icons{grid-column:2/4;grid-row:1;justify-self:end}
  header .stats{grid-column:1;grid-row:2;min-width:0}
  #lbBtn{grid-column:2;grid-row:2}
  #baseBtn{grid-column:3;grid-row:2}
}
@media (max-width:430px){.stats{gap:12px}.stat b{font-size:26px}h1{font-size:20px}}  /* телефоны: счёт и две кнопки в одну строку */
@media (max-width:360px){.stat b{font-size:24px}header .btn:not(.icon){padding:0 10px}h1{font-size:14px}.home{gap:6px}.home .logo{width:24px;height:18px}}
.hdr-actions{display:flex;gap:8px;align-items:center}
.hdr-actions .icons{display:flex;gap:8px}
a.btn{text-decoration:none}
body.playing #tgBtn{visibility:hidden}  /* во время забега прячется вместе с остальными кнопками шапки */
/* Десктоп: шапка в одну строку — заголовок слева, счёт по центру, кнопки справа */
@media (min-width:900px){
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:24px}
  header .bar-row{display:contents}
  header h1{grid-column:1}
  header .stats{grid-column:2;justify-self:center;display:grid;grid-template-columns:1fr 1fr;column-gap:32px}  /* две равные колонки: промежуток ровно над границей половин */
  header .stat:first-child{align-items:flex-end;text-align:right}  /* «Твой счёт» прижат вправо, к границе */
  header .hdr-actions{grid-column:3;justify-self:end}
}
.btn.icon{padding:0;width:44px}
/* выключенный звук: та же иконка, перечёркнутая красной диагональю внутри кнопки */
#sndBtn .off{display:none}
#sndBtn.snd-off .off{display:inline}
/* Иконка пробела: знак ⎵ на еле заметной «клавише» */
.kbd{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:22px;margin-left:10px;border-radius:6px;background:color-mix(in srgb,currentColor 12%,transparent)}
.kbd::before{content:'';width:18px;height:6px;margin-top:-2px;border:2px solid currentColor;border-top:0;border-radius:0 0 3px 3px}
.btn{font-family:Unbounded,system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1;height:44px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border-radius:999px;border:2px solid var(--btn);background:var(--btn);color:var(--btnfg);cursor:pointer}
/* Кнопки: две роли — primary (красная залитая) и secondary (контурная) */
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.secondary{background:transparent;border-color:var(--btn);color:var(--fg)}
/* Наведение (только мышь) и нажатие — для всех ролей */
.btn{transition:background-color .15s,border-color .15s,transform .1s}
@media (hover:hover){
  .btn.primary:not(:disabled):hover{background:color-mix(in srgb,var(--accent) 85%,var(--ink));border-color:color-mix(in srgb,var(--accent) 85%,var(--ink))}
  .btn.secondary:not(:disabled):hover{background:color-mix(in srgb,var(--btn) 14%,transparent)}
}
.btn:not(:disabled):active{transform:scale(.97)}
#startBtn:not(:disabled):active{transform:translateX(-50%) scale(.97)}
@media (max-width:560px){#startBtn:not(:disabled):active{transform:scale(.97)}}
.btn{-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.3;cursor:default}
header .btn:disabled{visibility:hidden}  /* во время забега кнопки шапки не тускнеют, а исчезают, место под ними остаётся */
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 8px;position:relative;min-height:0}  /* отступы 8px: слева, справа, снизу и между секциями */
.room{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0;border-radius:16px}
.field{--bh:clamp(70px,13vh,120px);--kh:calc(var(--bh)*1.1);flex:1;position:relative;display:grid;--r2:calc(var(--bh)*1.26 + 34px);--r3:calc(var(--kh) + 36px);grid-template-rows:minmax(0,1fr) minmax(var(--r2),1fr) minmax(var(--r3),1fr) minmax(0,1fr);row-gap:calc(var(--bh)*.35);min-height:0}
#black{background:var(--room-black);color:var(--ivory)}  /* чёрная секция светлее фона страницы, чтобы читались края */
#white{background:var(--room-white);color:var(--ink)}  /* белая секция — светлая слоновая кость */
.name{position:relative;display:block;color:inherit;text-decoration:none;font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(34px,9vw,96px);line-height:1;letter-spacing:-.03em;padding:16px 8px 0;text-align:center;flex:none;-webkit-tap-highlight-color:transparent}
/* Названия секций — ссылки на Lu4. При наведении надпись проявляется, снизу выезжает «[лого Lu4] Играть на Lu4 →». Размер текста не меняется — за секцию не вылезает */
.name .t{opacity:.18;transition:opacity .25s}
.name .go{position:absolute;left:8px;right:8px;top:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:Manrope,system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:0;line-height:1.2;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .go i{display:inline-block;font-style:normal;transition:transform .25s}
.name .go .lu4{display:block;width:22px;height:22px;flex:none}
@media (hover:hover){.name:hover .t{opacity:1}.name:hover .go{opacity:1;transform:none}.name:hover .go i{transform:translateX(4px)}}
.name:focus-visible{outline:none}.name:focus-visible .t{opacity:1}.name:focus-visible .go{opacity:1;transform:none}
body.playing .name{pointer-events:none}  /* во время забега тап по надписи двигает keltaa, а не уводит на сайт */
.lane{display:flex;justify-content:center;align-items:center;min-height:0}
.lane.cap{grid-row:2;grid-column:1}
.lane.k{grid-row:3;grid-column:1}
.mover{will-change:transform}
.chip{font-family:Unbounded,system-ui,sans-serif;font-weight:500;font-size:14px;padding:10px 18px;border-radius:999px;color:var(--ivory);white-space:nowrap}
.chip.cap{background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.chip.cap .sprite{position:relative;display:block;margin-bottom:calc(var(--bh)*.26)}
.chip.cap .sprite.right{transform:scaleX(-1)}
.chip.cap .body{display:block;height:var(--bh);width:auto;image-rendering:pixelated;pointer-events:none;position:relative;z-index:1}
.chip.cap .leg{position:absolute;top:88%;width:32%;height:auto;image-rendering:pixelated;pointer-events:none}
.chip.cap .leg.l1{left:14%}
.chip.cap .leg.l2{left:34%}
.chip.cap.tense .leg.l1{animation:step .18s steps(1) infinite}
.chip.cap.tense .leg.l2{animation:step .18s steps(1) infinite;animation-delay:-.09s}
@keyframes step{0%{transform:translate(0,0)}50%{transform:translate(-25%,-22%)}}
.chip.cap .lbl,.chip.k .lbl{color:#958F7F;font-size:21px}
/* keltaa: аватар без подложки + серая подпись, как у CapMaTa; на чёрной клетке смотрит вправо, на белой — влево */
.chip.k{background:none;padding:0;color:#958F7F;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
/* подсказка управления (только десктоп): клавиши-стрелки + подпись, отдельно от персонажа; вне потока — keltaa не прыгает, когда она исчезает */
.kbhint{display:none;position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);align-items:center;gap:6px;white-space:nowrap;color:var(--ivory);font-family:Manrope,system-ui,sans-serif;font-weight:600;font-size:13px;line-height:1}
.kbhint .key{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;border-radius:6px;background:color-mix(in srgb,currentColor 12%,transparent);font-style:normal;font-family:system-ui,sans-serif;font-size:15px}
.kbhint .txt{margin-left:4px;opacity:.75}
.chip.k .ava{display:block;height:var(--kh);width:auto;pointer-events:none}
.chip.k.flip .ava{transform:scaleX(-1)}
@media (hover:hover) and (pointer:fine){
  .kbhint{display:flex}
  body.keys-used .kbhint{display:none}  /* после первого нажатия стрелки в забеге — прячем */
  .field .pop{top:calc(var(--kh)/2 + 86px)}
}
/* 3. подсказка «куда тапать» на телефоне в первые секунды игры */
.taphint{position:absolute;left:0;right:0;bottom:16%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;opacity:.75;font-family:Unbounded,system-ui,sans-serif;font-weight:500;font-size:16px}
.taphint svg{animation:tap 0.9s ease-in-out infinite;transform-origin:50% 80%}
@keyframes tap{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(6px) scale(.9)}}
.chip.cap.run{animation:twitch .2s infinite}
.chip.cap.tense{animation:twitch .06s infinite}
@keyframes twitch{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,1px) rotate(-3deg)}50%{transform:translate(3px,-2px)}75%{transform:translate(4px,1px) rotate(3deg)}}
.pop{grid-row:3;grid-column:1;align-self:center;position:relative;top:calc(var(--kh)/2 + 56px);text-align:center;font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(21px,4.5vw,30px);opacity:0;pointer-events:none}
.pop.plus{color:var(--green)}
.pop.minus{color:var(--red)}
.pop.show{animation:pop 1.1s ease-out}
@media (max-height:600px) and (hover:none){.pop{top:calc(var(--kh)/2 + 46px)}}
@keyframes pop{0%,45%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(24px)}}
/* Старт висит поверх клеток и не занимает места в вёрстке; во время игры скрыт */
#startBtn{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30}
#startBtn{height:66px;font-size:21px;padding:0 27px}  /* в 1.5 раза больше обычной кнопки */
@media (max-width:560px){#startBtn{left:20px;right:20px;transform:none}
  /* место под «Старт» зарезервировано всегда, чтобы кнопка не закрывала keltaa и вёрстка не прыгала при старте */
  .field{padding-bottom:calc(66px + 24px + 12px + env(safe-area-inset-bottom,0px))}}
@media (max-height:600px){#startBtn{bottom:calc(8px + env(safe-area-inset-bottom,0px))}}  /* низкие экраны: не наезжать на keltaa */
@media (max-width:560px) and (max-height:600px){.field{padding-bottom:calc(66px + 8px + 16px + env(safe-area-inset-bottom,0px))}}
@media (max-height:600px){.field{--bh:clamp(56px,11vh,120px);row-gap:calc(var(--bh)*.12)}}  /* низкие экраны: персонажи чуть меньше, чтобы всё влезло над «Старт» */
#startBtn:disabled{visibility:hidden}
.room{-webkit-tap-highlight-color:transparent}
@media (hover:none) and (pointer:coarse){.kbd{display:none}}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(16,12,2,.7);z-index:50;padding:20px}
.card{background:var(--bg);color:var(--fg);border-radius:20px;padding:26px 22px 0;max-width:400px;width:100%;text-align:center;max-height:100%;overflow-y:auto;overscroll-behavior:contain}
.card.bare{background:none;padding:0;border-radius:0;max-width:min(1200px,calc((100vh - 40px)*16/9))}
.vids{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.vid{display:flex;align-items:center;gap:14px;width:100%;padding:8px;border:0;border-radius:14px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vid:hover{background:rgba(140,133,114,.15)}
.vid:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vid .th{position:relative;flex:none;width:144px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--ink)}
.vid .th img{display:block;width:100%;height:100%;object-fit:cover}
.vid .play{position:absolute;inset:0;margin:auto;width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.vid .tt{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:18px;min-width:0;overflow-wrap:anywhere}
@media (max-width:400px){.vid{gap:10px}.vid .th{width:96px}.vid .tt{font-size:15px}}
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--ink)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card h2{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:24px;margin:0 0 8px}
.card p{margin:0 0 8px;line-height:1.5;font-size:15px}
.card .big{font-family:Unbounded,system-ui,sans-serif;font-size:44px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums}
.promo{margin:24px 0 0;padding:24px 0 8px;border-top:1px solid rgba(140,133,114,.35)}
.promo p{margin:0 0 4px;font-size:15px;opacity:.75}
.promo a{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:16px;color:inherit;text-decoration:underline;text-underline-offset:4px}
.promo a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.lb{list-style:none;margin:10px 0 0;padding:0;text-align:left;counter-reset:n}
.lb li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;counter-increment:n;font-size:15px}
.lb li::before{content:counter(n);font-family:Unbounded,system-ui,sans-serif;font-size:13px;width:22px;opacity:.6}
.lb li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li .pt{font-family:Unbounded,system-ui,sans-serif;font-variant-numeric:tabular-nums}
/* 1–3 места: номер остаётся, рядом награда (та же, что на карточке) */
.lb .mi{flex:none;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.lb .mi img{display:block;image-rendering:pixelated}
.lb .mi .crown{width:24px;height:14px}
.lb .mi .med{width:17px;height:20px}
/* своя строка — мягкая подложка акцентного цвета */
.lb li.you{background:rgba(140,133,114,.28)}  /* своя строка — серая подложка в тон палитры */
.lb li.you::before{opacity:1}
.lb li.entry{background:rgba(140,133,114,.28);align-items:center}
.lb li.entry::before{opacity:1}
.lb li.entry input{margin:0;flex:1;min-width:0;padding:6px 10px;font-size:15px;border-radius:8px}
.muted{opacity:.6;font-size:14px}
.card input{width:100%;margin-top:10px;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--fg);background:transparent;color:var(--fg)}
.card input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shareprev{display:block;width:100%;max-width:360px;aspect-ratio:1;margin:0 auto;border-radius:12px;background:#0d0d0d}
.card .row .btn{flex:1 1 0;min-width:0;height:auto;min-height:44px}  /* в окнах: одна кнопка — на всю ширину, две — пополам */
.card .result{margin:8px 0 0;font-size:18px}  /* очки опытного игрока под «CapMaT убежал» */
.card .howto{margin:10px auto 0;max-width:320px;font-size:15px;line-height:1.45;opacity:.8}  /* правила под заголовком проигрыша */
.card .row{display:flex;gap:10px;justify-content:center;margin-top:12px;padding:12px 0 26px;flex-wrap:wrap;position:sticky;bottom:0;z-index:2;background:var(--bg)}  /* кнопки окна прилипают к низу; отступ над ними тот же 24px */
.card .row::before{content:'';position:absolute;left:0;right:0;top:-18px;height:18px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}  /* содержимое уходит под кнопки плавно */
.card:not(:has(.row)){padding-bottom:26px}
@media (prefers-reduced-motion:reduce){.chip.cap.run,.chip.cap.tense{animation-duration:.5s}}

/* ===== Телефон горизонтально (низкий экран): всё ужимается по высоте ===== */
@media (orientation:landscape) and (max-height:500px){
  header{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;column-gap:8px;row-gap:0;align-items:center;padding:6px 12px}
  header .bar-row,header .hdr-actions{display:contents}
  header h1{grid-column:1;grid-row:1;padding-right:0;font-size:17px;height:auto}
  .home{gap:8px}.home .logo{width:26px;height:20px}
  header .stats{grid-column:2;grid-row:1;justify-self:center;gap:14px}
  .stat span{font-size:11px;margin-bottom:2px}
  .stat b{font-size:20px}
  header .icons{grid-column:3;grid-row:1;gap:6px}
  #lbBtn{grid-column:4;grid-row:1} #baseBtn{grid-column:5;grid-row:1}
  header .btn{height:36px;padding:0 12px;font-size:13px}
  header .btn.icon{width:36px;padding:0}
  main{gap:6px;padding:0 6px 6px}
  .name{font-size:clamp(16px,8vh,40px);padding:8px 6px 0;white-space:nowrap}
  .field{--bh:clamp(30px,13vh,70px);--r2:calc(var(--bh)*1.26 + 22px);--r3:calc(var(--kh) + 22px);row-gap:calc(var(--bh)*.1);padding-bottom:0}
  .chip.cap .lbl,.chip.k .lbl{font-size:13px}
  .field .pop{font-size:16px;top:calc(var(--kh)/2 + 26px)}
  #startBtn{height:44px;font-size:16px;padding:0 20px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .taphint{bottom:10%;font-size:12px;gap:2px}.taphint svg{width:26px;height:26px}
  #overlay{padding:10px}
  .card{padding-top:16px}
  .card h2{font-size:20px;margin-bottom:4px}
  .card .big{font-size:30px}
}
@media (orientation:landscape) and (max-height:500px) and (max-width:640px){  /* самые узкие горизонтальные (iPhone SE 1-го поколения) */
  header{column-gap:6px;padding:6px 8px}
  header h1{font-size:13px}.home{gap:6px}.home .logo{width:22px;height:17px}
  header .stats{gap:10px}.stat b{font-size:17px}.stat span{font-size:10px}
  header .btn{height:32px;padding:0 9px;font-size:12px}header .btn.icon{width:32px}header .icons{gap:4px}
}
</style>
</head>

  const kChip=document.createElement('div');kChip.className='chip k';kChip.innerHTML='<img class="ava" alt="" src="keltaa.png"><span class="lbl">\u2665\uFE0E keltaa</span><span class="kbhint" aria-hidden="true"><i class="key">←</i><i class="key">→</i><span class="txt">юзай клавиатуру</span></span>';

  // Перелёт keltaa между клетками. Логика игры меняет клетку мгновенно, это только картинка:
  // летит копия в фиксированном слое поверх клеток (у .room overflow:hidden, внутри неё не перелететь).
  const fxLayer=document.createElement('div');
  fxLayer.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:40';
  document.body.appendChild(fxLayer);
  const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let kGhost=null;
  const kRect=()=>(kGhost||kChip).getBoundingClientRect();
  function clearGhost(){
    if(!kGhost)return;
    kGhost.getAnimations().forEach(a=>a.cancel());kGhost.remove();kGhost=null;
    kChip.style.visibility='';
  }
  function flyK(from,dir){
    clearGhost();
    const to=kChip.getBoundingClientRect();
    const dx=from.left-to.left, dy=from.top-to.top;
    if(reduceMotion||(!dx&&!dy)||!kChip.animate)return;
    const g=kChip.cloneNode(true);
    g.style.cssText='position:fixed;margin:0;left:'+to.left+'px;top:'+to.top+'px;width:'+to.width+'px;height:'+to.height+'px';
    g.querySelector('.ava').style.height=kChip.querySelector('.ava').getBoundingClientRect().height+'px';
    fxLayer.appendChild(g);kGhost=g;kChip.style.visibility='hidden';
    const lift=Math.min(70,Math.abs(dx)*.22);  // высота дуги
    const T=(x,y,sx,sy,r)=>'translate('+x+'px,'+y+'px) scale('+sx+','+sy+') rotate('+r+'deg)';
    const a=g.animate([
      {transform:T(dx,dy,1,1,0)},
      {offset:.12,transform:T(dx*.9,dy*.9-lift*.35,1.14,.86,-dir*5)},   // отрыв: вытягивается по ходу
      {offset:.5, transform:T(dx*.4,dy*.4-lift,1.04,.96,dir*7)},        // верх дуги
      {offset:.78,transform:T(0,0,1.16,.84,0)},                         // приземление: сплющивается
      {offset:.9, transform:T(0,-lift*.08,.96,1.04,0)},                 // отскок
      {transform:T(0,0,1,1,0)}
    ],{duration:300,easing:'cubic-bezier(.3,.7,.4,1)'});
    a.onfinish=()=>{if(kGhost===g)clearGhost()};
  }

    $('startBtn').disabled=false;$('lbBtn').disabled=false;$('baseBtn').disabled=false;$('sndBtn').disabled=false;
    const n10=pts%10,n100=pts%100;
    const word=(n10===1&&n100!==11)?'очко':(n10>=2&&n10<=4&&(n100<12||n100>14))?'очка':'очков';
    if(qualifies(pts)){
      prepareCard(); // шрифты и картинки карточки грузятся, пока игрок вводит ник
      const place=top.filter(r=>r.score>=pts).length+1;
      openCard('<div class="big">Место #'+place+'</div><p style="font-size:18px">'+pts+' '+word+'</p>'+
        '<input id="nameIn" maxlength="50" placeholder="Введи никнейм">'+
        '<div class="row"><button class="btn primary" id="saveBtn">Сохранить</button><button class="btn secondary" id="cancelBtn">Закрыть</button></div>','entry');
      const inp=$('nameIn');inp.focus();
      const go=()=>{if($('saveBtn').disabled)return;const n=inp.value.trim().slice(0,50).replace(/[\uD800-\uDBFF]$/,'');if(!n){inp.focus();return}
        $('saveBtn').disabled=true;saveScore(pts,n)};
      $('saveBtn').onclick=go;
      inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')go();if(e.key==='Escape')closeAnyCard()});
      $('cancelBtn').onclick=()=>{closeCard();reset();$('startBtn').focus()};
    }else{
      const againLabel=pts>=EXPERIENCED?'Гоу!':'Ещё раз'; // опытному — «Гоу!»
      openCard('<div class="big">CapMaT убежал</div>'+
        // новичку — правила; опытному (от EXPERIENCED очков) — его результат, даже если в топ-10 не попал
        (pts>=EXPERIENCED
          ?'<p class="result">Вы набрали '+pts+' '+word+'. Попробуем&nbsp;ещё&nbsp;раз?</p>'
          :'<p class="howto">'+(isTouch
            ?'Держи keltaa рядом с петухом. Петух прыгнул — тапни по его клетке, чтобы перебежать следом.'
            :'Держи keltaa в одной секции с петухом. Используй стрелочки на клавиатуре ← и →, чтобы преследовать петуха.')+'</p>')+
        '<div class="row"><button class="btn primary" id="again" aria-label="'+againLabel+' (пробел)">'+againLabel+'<i class="kbd" aria-hidden="true"></i></button><button class="btn secondary" id="later">Позже</button></div>');
      wireButtons();
    }
  }

  $('startBtn').onclick=start;
  // на тач-экранах тап по клетке работает как стрелка в её сторону
  rooms.black.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;if(!e.isTrusted){if(s.running)s.inp.u++;return}if(s.running)s.inp.t++;move(-1)});
  rooms.white.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;if(!e.isTrusted){if(s.running)s.inp.u++;return}if(s.running)s.inp.t++;move(1)});
  window.addEventListener('keydown',e=>{
    if(s.running&&['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))document.body.classList.add('keys-used'); // разобрался с управлением — прячем подсказку до перезагрузки страницы
    if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();if(!e.isTrusted){if(s.running)s.inp.u++}else{if(s.running)s.inp.k++;move(-1)}}
    if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();if(!e.isTrusted){if(s.running)s.inp.u++}else{if(s.running)s.inp.k++;move(1)}}
    const view=$('overlay').dataset.view;
    if(e.code==='Escape'&&$('overlay').style.display==='flex'){closeAnyCard();return}
    if(e.code==='Space'){if(view==='base'||view==='video'||view==='card')return;e.preventDefault();if(!s.running&&view!=='entry')start()}
  });
  window.addEventListener('keyup',e=>{const v=$('overlay').dataset.view;if(e.code==='Space'&&v!=='entry'&&v!=='base'&&v!=='video'&&v!=='card')e.preventDefault()});
  // ---------- Фоновая музыка ----------
  // Громкость через Web Audio (GainNode): у <audio>.volume на iPhone/iPad громкость не меняется вообще.
  const VOLUME=0.1;
  let soundOn=true,musicStarted=false,actx=null,gain=null,needRebuild=false,hiddenAt=0;
  const sndBtn=$('sndBtn');
  const bufP=fetch('sound.mp3').then(r=>r.arrayBuffer()).catch(()=>null); // скачиваем один раз, при пересоздании звука берём копию
  function syncSnd(){
    sndBtn.classList.toggle('snd-off',!soundOn);
    sndBtn.setAttribute('aria-pressed',String(soundOn));
    sndBtn.setAttribute('aria-label',soundOn?'Выключить звук':'Включить звук');
    if(gain&&actx)gain.gain.setTargetAtTime(soundOn?VOLUME:0,actx.currentTime,0.05);
  }
  sndBtn.onclick=()=>{soundOn=!soundOn;syncSnd();sndBtn.blur()};
  // Создать звук с нуля: новый AudioContext + музыка по кругу. Вызывается при первом старте
  // и когда старый звук умер (iPhone после долгого фона закрывает звуковой канал насовсем).
  async function buildAudio(){
    try{if(actx&&actx.state!=='closed')actx.close().catch(()=>{})}catch(e){}
    actx=null;gain=null;
    // Safari 17+: тип «воспроизведение» — музыка играет и при включённом беззвучном режиме
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    try{
      const c=new (window.AudioContext||window.webkitAudioContext)();actx=c;
      const g=c.createGain();gain=g;g.gain.value=soundOn?VOLUME:0;g.connect(c.destination);
      if(c.state!=='running')c.resume().catch(()=>{});
      const raw=await bufP;if(!raw||actx!==c)return;
      const buf=await new Promise((ok,bad)=>c.decodeAudioData(raw.slice(0),ok,bad));
      if(actx!==c)return; // пока декодировали, звук уже пересоздали
      const src=c.createBufferSource();src.buffer=buf;src.loop=true;src.connect(g);src.start();
    }catch(e){}
  }
  // Будим звук при любом действии игрока: возобновляем, а если не выходит или долго были в фоне — пересоздаём.
  function wakeAudio(){
    if(!musicStarted)return;
    if(needRebuild||!actx||actx.state==='closed'){needRebuild=false;buildAudio();return}
    if(actx.state!=='running'){
      const c=actx;
      c.resume().then(()=>{if(actx===c&&c.state!=='running')buildAudio()}).catch(()=>{if(actx===c)buildAudio()});
    }
  }
  ['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,wakeAudio,true));
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      hiddenAt=performance.now();
      if(isTouch&&actx&&actx.state==='running')actx.suspend().catch(()=>{}); // на телефоне — пауза, когда браузер свёрнут
      return;
    }
    if(isTouch&&musicStarted&&performance.now()-hiddenAt>30000)needRebuild=true; // телефон: после долгого фона пересоздадим при первом касании
    else wakeAudio();
  });
  // музыка включается с первым стартом игры в этой сессии и дальше не выключается
  function startMusic(){
    if(musicStarted){wakeAudio();return}
    musicStarted=true;buildAudio();
  }
  syncSnd();
  reset();
  routeHash();
})();
</script>
