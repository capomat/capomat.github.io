<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Догони Сармата</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ff2d2d; --cap:#2f6bff; --green:#1fbf4a;
  --bg:#d9d9d9; --fg:#000; --btn:#000; --btnfg:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262626;--fg:#fff;--btn:#fff;--btnfg:#000}}
:root[data-theme="dark"]{--bg:#262626;--fg:#fff;--btn:#fff;--btnfg:#000}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;flex-direction:column;gap:10px;padding:12px 16px 10px;flex:none}
h1{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:22px;line-height:28px;height:28px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;height:48px}
.stats{display:flex;gap:28px}
.stat{display:flex;flex-direction:column;line-height:1}
.stat span{font-size:12px;opacity:.6;margin-bottom:5px}
.stat b{font-family:Unbounded,system-ui,sans-serif;font-weight:500;font-size:20px;font-variant-numeric:tabular-nums;min-width:5ch}
@media (max-width:440px){.stats{gap:16px}.stat b{font-size:18px;min-width:0}.stat #score{min-width:3.9em}}
@media (max-width:360px){.stats{gap:10px}.stat b{font-size:13px}.hdr-actions{gap:6px}.btn{padding:0 14px}}
.hdr-actions{display:flex;gap:8px;align-items:center}
.btn.icon{padding:0;width:44px}
#sndBtn .off{display:none}
#sndBtn.snd-off .on{display:none}
#sndBtn.snd-off .off{display:inline}
.kbd{display:inline-block;width:26px;height:9px;border:2px solid currentColor;border-top:0;border-radius:0 0 4px 4px;margin-left:10px;vertical-align:middle;opacity:.9}
.btn{font-family:Unbounded,system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1;height:44px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border-radius:999px;border:2px solid var(--btn);background:var(--btn);color:var(--btnfg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn{-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;position:relative;min-height:0}
.room{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.field{--bh:clamp(70px,13vh,120px);flex:1;position:relative;display:grid;--r2:calc(var(--bh)*1.26 + 26px);--r3:52px;grid-template-rows:minmax(0,1fr) minmax(var(--r2),1fr) minmax(var(--r3),1fr) minmax(0,1fr);row-gap:calc(var(--bh)*.35);min-height:0}
#black{background:#000;color:#fff}
#white{background:#fff;color:#000}
.name{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(34px,9vw,96px);line-height:1;letter-spacing:-.03em;opacity:.18;padding:16px 8px 0;text-align:center;flex:none}
.lane{display:flex;justify-content:center;align-items:center;min-height:0}
.lane.cap{grid-row:2;grid-column:1}
.lane.k{grid-row:3;grid-column:1}
.mover{will-change:transform}
.chip{font-family:Unbounded,system-ui,sans-serif;font-weight:500;font-size:14px;padding:10px 18px;border-radius:999px;color:#fff;white-space:nowrap}
.chip.cap{background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.chip.cap .sprite{position:relative;display:block;margin-bottom:calc(clamp(70px,13vh,120px)*.26)}
.chip.cap .sprite.right{transform:scaleX(-1)}
.chip.cap .body{display:block;height:clamp(70px,13vh,120px);width:auto;image-rendering:pixelated;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));pointer-events:none;position:relative;z-index:1}
.chip.cap .leg{position:absolute;top:88%;width:32%;height:auto;image-rendering:pixelated;pointer-events:none}
.chip.cap .leg.l1{left:14%}
.chip.cap .leg.l2{left:34%}
.chip.cap.tense .leg.l1{animation:step .18s steps(1) infinite}
.chip.cap.tense .leg.l2{animation:step .18s steps(1) infinite;animation-delay:-.09s}
@keyframes step{0%{transform:translate(0,0)}50%{transform:translate(-25%,-22%)}}
.chip.cap .lbl{color:#8a8a8a;font-size:14px}
.chip.k{background:#9a9a9a;color:#000}
.chip.cap.run{animation:twitch .2s infinite}
.chip.cap.tense{animation:twitch .06s infinite}
@keyframes twitch{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,1px) rotate(-3deg)}50%{transform:translate(3px,-2px)}75%{transform:translate(4px,1px) rotate(3deg)}}
.pop{grid-row:3;grid-column:1;align-self:center;position:relative;top:48px;text-align:center;font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(14px,3vw,20px);opacity:0;pointer-events:none}
.pop.plus{color:var(--green)}
.pop.minus{color:var(--red)}
.pop.show{animation:pop .6s ease-out}
@keyframes pop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(24px)}}
footer{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
footer p{margin:0;font-size:14px;opacity:.75;text-align:center;max-width:520px;line-height:1.45}
.room{-webkit-tap-highlight-color:transparent}
@media (hover:none) and (pointer:coarse){.kbd-hint,.kbd{display:none}}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:50;padding:20px}
.card{background:var(--bg);color:var(--fg);border-radius:20px;padding:26px 22px;max-width:400px;width:100%;text-align:center}
.card h2{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:24px;margin:0 0 8px}
.card p{margin:0 0 8px;line-height:1.5;font-size:15px}
.card .big{font-family:Unbounded,system-ui,sans-serif;font-size:44px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums}
.lb{list-style:none;margin:10px 0 0;padding:0;text-align:left;counter-reset:n}
.lb li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;counter-increment:n;font-size:15px}
.lb li::before{content:counter(n);font-family:Unbounded,system-ui,sans-serif;font-size:13px;width:22px;opacity:.6}
.lb li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li .pt{font-family:Unbounded,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.lb li.you{background:var(--green);color:#fff}
.lb li.you::before{opacity:1}
.lb li.entry{background:var(--green);color:#fff;align-items:center}
.lb li.entry::before{opacity:1}
.lb li.entry input{margin:0;flex:1;min-width:0;padding:6px 10px;font-size:15px;border-color:#fff;color:#fff;border-radius:8px}
.lb li.entry input::placeholder{color:rgba(255,255,255,.75)}
.muted{opacity:.6;font-size:14px}
.card input{width:100%;margin-top:10px;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--fg);background:transparent;color:var(--fg)}
.card input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.card .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.chip.cap.run,.chip.cap.tense{animation-duration:.5s}}
</style>
</head>
<body>
<header>
  <h1>Догони Сармата</h1>
  <div class="bar-row">
    <div class="stats">
      <div class="stat"><span>Счёт</span><b id="score">0</b></div>
      <div class="stat"><span>Рекорд</span><b id="best">—</b></div>
    </div>
    <div class="hdr-actions">
      <button class="btn ghost icon" id="sndBtn" aria-label="Выключить звук" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <g class="on"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></g>
          <g class="off"><path d="M16 9l5 6M21 9l-5 6"/></g>
        </svg>
      </button>
      <button class="btn ghost" id="lbBtn">Лидеры</button>
    </div>
  </div>
</header>
<main>
  <div class="room" id="black"><div class="name">Lu4 Black</div><div class="field"><div class="lane cap"></div><div class="lane k"></div><div class="pop"></div></div></div>
  <div class="room" id="white"><div class="name">Lu4 White</div><div class="field"><div class="lane cap"></div><div class="lane k"></div><div class="pop"></div></div></div>
  <div id="overlay"><div class="card" id="card"></div></div>
</main>
<footer>
  <div class="controls">
    <button class="btn red" id="startBtn" aria-label="Старт (пробел)">Старт<i class="kbd" aria-hidden="true"></i></button>
  </div>
  <p class="kbd-hint">Управляй keltaa стрелочками ← и →, чтобы догнать Сармата</p>
</footer>

  capMover.appendChild(capChip);
  const kChip=document.createElement('div');kChip.className='chip k';kChip.textContent='\u2665\uFE0E keltaa';

  const DRAIN=850;   // мс врозь до пустого запаса (запас не показывается)
  const REFILL=700;  // мс рядом до полного запаса

  let s, raf=0;
  function reset(){
    s={k:'black',cap:'white',running:false,elapsed:0,score:0,meter:1,
       phase:'rest',phaseT:0,phaseDur:0,fake:false,nextIn:1200,last:0,clean:0,sinceJump:0};
    place();capMover.style.transform='';capChip.className='chip cap';
    $('score').textContent='0';
  }
  function place(){
    if(capMover.parentNode!==rooms[s.cap].querySelector('.lane.cap'))rooms[s.cap].querySelector('.lane.cap').appendChild(capMover);
    capChip.querySelector('.sprite').classList.toggle('right',s.cap==='black');
    if(kChip.parentNode!==rooms[s.k].querySelector('.lane.k'))rooms[s.k].querySelector('.lane.k').appendChild(kChip);
  }
  function pop(room,pts,text){
    s.score=Math.max(0,s.score+pts);
    const el=rooms[room].querySelector('.pop');
    el.textContent=(pts>0?'+':'−')+Math.abs(pts);
    el.className='pop '+(pts>0?'plus':'minus');
    void el.offsetWidth;el.classList.add('show');
  }
  function diff(){const t=Math.min(1,s.elapsed/90000);return{
    t,
    rest:lerp(1300,380,t)*(0.6+Math.random()*0.8), // пауза между рывками
    windup:lerp(650,160,t),                        // сколько он «замахивается»
    fakeP:lerp(0.08,0.38,t)                        // шанс обманки
  }}

  function start(){
    reset();s.running=true;s.last=performance.now();
    $('overlay').style.display='none';$('overlay').dataset.view='';loadTop();
    $('startBtn').disabled=true;$('lbBtn').disabled=true;$('sndBtn').disabled=true;myId=null;startMusic();
    capChip.className='chip cap run';
    raf=requestAnimationFrame(loop);
  }
  function move(dir){
    if(!s.running)return;
    const dest=dir<0?'black':'white';
    if(dest===s.k)return;
    const leaving=s.k===s.cap;
    s.k=dest;place();
    if(leaving){
      // ушёл из клетки CapMat: угадал прыжок или повёлся
      if(s.phase==='windup'&&!s.fake)pop(s.k,40,'предвидел');
      else if(s.phase==='windup'&&s.fake)pop(s.k,-30,'повёлся');
      else pop(s.k,-20,'мимо');
    }else if(s.k===s.cap&&s.sinceJump<260){
      pop(s.k,25,'чисто');
    }
  }

  function loop(now){
    const dt=Math.min(50,now-s.last);s.last=now;
    s.elapsed+=dt;s.sinceJump+=dt;
    const d=diff();

    if(s.phase==='rest'){
      s.nextIn-=dt;
      if(s.nextIn<=0){
        s.phase='windup';s.phaseT=0;s.phaseDur=d.windup;s.fake=Math.random()<d.fakeP;
        capChip.className='chip cap tense';
      }
    }else{
      s.phaseT+=dt;
      const p=Math.min(1,s.phaseT/s.phaseDur);
      const dirX=s.cap==='black'?1:-1; // к границе между клетками
      capMover.style.transform='translateX('+(dirX*p*16)+'vw)';
      if(p>=1){
        if(!s.fake){s.cap=other(s.cap);s.sinceJump=0;place();}
        capMover.style.transform='';capChip.className='chip cap run';
        s.phase='rest';s.nextIn=d.rest;
      }
    }

    if(s.k===s.cap){
      s.meter=Math.min(1,s.meter+dt/REFILL);
      s.score+=dt/1000*10*(1+d.t*2);
    }else{
      s.meter-=dt/DRAIN;
      if(s.meter<=0)return over();
    }
    $('score').textContent=Math.floor(s.score);
    raf=requestAnimationFrame(loop);
  }

  async function loadTop(){
    try{
      const r=await fetch(SB_URL+'?select=id,name,score&order=score.desc,id.asc&limit=10',{headers:SB_H});
      if(!r.ok)throw new Error(r.status);

    }catch(e){db=null}
    // «Рекорд» в шапке — первое место общей таблицы

  }
  loadTop();
  function qualifies(pts){
    if(!db||pts<=0)return false;
    return top.length<10||pts>(top[top.length-1].score||0);
  }
  function boardHtml(pending){
    if(!db)return '<p class="muted">Таблица лидеров сейчас недоступна.</p>';
    if(!lbReady)return '<p class="muted">Загружаю…</p>';
    const row=r=>'<li class="'+(r.id===myId?'you':'')+'"><span class="nm">'+esc(r.name||'Аноним')+'</span><span class="pt">'+(r.score|0)+'</span></li>';
    if(pending){
      // строка с полем для ника вставляется на своё место
      const i=top.filter(r=>r.score>=pending.pts).length;
      const entry='<li class="entry"><input id="nameIn" maxlength="16" placeholder="Твой ник"><span class="pt">'+pending.pts+'</span></li>';
      const rows=top.map(row);rows.splice(i,0,entry);
      return '<ol class="lb">'+rows.slice(0,10).join('')+'</ol>';
    }
    if(!top.length)return '<p class="muted">Пока пусто. Будь первым.</p>';
    return '<ol class="lb">'+top.map(row).join('')+'</ol>';
  }

      const r=await fetch(SB_URL+'?select=id',{method:'POST',

  function over(){

  }
  sndBtn.onclick=()=>{soundOn=!soundOn;syncSnd();sndBtn.blur()};
  // музыка включается с первым стартом игры в этой сессии и дальше не выключается
  async function startMusic(){
    if(musicStarted)return;musicStarted=true;
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      gain=actx.createGain();gain.gain.value=soundOn?VOLUME:0;gain.connect(actx.destination);
      if(actx.state==='suspended')actx.resume();
      const raw=await bufP;if(!raw)return;
      const buf=await new Promise((ok,bad)=>actx.decodeAudioData(raw,ok,bad));
      const src=actx.createBufferSource();src.buffer=buf;src.loop=true;src.connect(gain);src.start();
    }catch(e){}
  }
  syncSnd();
  reset();
})();
</script>
